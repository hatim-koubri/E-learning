spring:
  application:
    name: elearning-backend
  autoconfigure:
    exclude: org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:510MB}
server:
  port: 8080
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
  mail:
    from: ${MAIL_FROM:no-reply@elearning.local}
  notifications:
    class-reminder-minutes: ${CLASS_REMINDER_MINUTES:60}
    class-reminder-scan-ms: ${CLASS_REMINDER_SCAN_MS:60000}
    mandatory-email-scan-ms: ${MANDATORY_EMAIL_SCAN_MS:60000}
    mandatory-email-max-attempts: ${MANDATORY_EMAIL_MAX_ATTEMPTS:5}
    mandatory-email-initial-backoff-seconds: ${MANDATORY_EMAIL_INITIAL_BACKOFF_SECONDS:30}
    mandatory-email-max-backoff-seconds: ${MANDATORY_EMAIL_MAX_BACKOFF_SECONDS:3600}
    mandatory-email-batch-size: ${MANDATORY_EMAIL_BATCH_SIZE:20}
  cors:
    allowed-origin: ${WEB_ORIGIN:http://localhost:3000}
  web:
    base-url: ${APP_BASE_URL:http://localhost:3000}
  storage:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
    url-expiry-seconds: ${MINIO_URL_EXPIRY_SECONDS:300}
  upload:
    image-max-bytes: ${UPLOAD_IMAGE_MAX_BYTES:10485760}
    pdf-max-bytes: ${UPLOAD_PDF_MAX_BYTES:52428800}
    video-max-bytes: ${UPLOAD_VIDEO_MAX_BYTES:524288000}
  jitsi:
    base-url: ${JITSI_BASE_URL:https://meet.jit.si}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
