spring:
  application:
    name: elearning-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/elearning?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:elearning}
    password: ${DB_PASSWORD:elearning-dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:510MB}
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-key-change-me-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
  mail:
    from: ${MAIL_FROM:no-reply@elearning.local}
  cors:
    allowed-origin: ${WEB_ORIGIN:http://localhost:3000}
  admin:
    enabled: ${DEV_ADMIN_ENABLED:false}
    email: ${DEV_ADMIN_EMAIL:}
    password: ${DEV_ADMIN_PASSWORD:}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:contenus-pedagogiques}
    url-expiry-seconds: ${MINIO_URL_EXPIRY_SECONDS:300}
  upload:
    image-max-bytes: ${UPLOAD_IMAGE_MAX_BYTES:10485760}
    pdf-max-bytes: ${UPLOAD_PDF_MAX_BYTES:52428800}
    video-max-bytes: ${UPLOAD_VIDEO_MAX_BYTES:524288000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
