spring:
  autoconfigure:
    exclude: org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
app:
  jwt:
    secret: test-secret-key-with-at-least-thirty-two-characters
    expiration-minutes: 15
  password-reset:
    expiration-minutes: 30
  mail:
    from: test@elearning.local
  notifications:
    class-reminder-minutes: 60
    class-reminder-scan-ms: 3600000
    mandatory-email-scan-ms: 3600000
    mandatory-email-max-attempts: 3
    mandatory-email-initial-backoff-seconds: 1
    mandatory-email-max-backoff-seconds: 4
    mandatory-email-batch-size: 20
  cors:
    allowed-origin: http://localhost:3000
  web:
    base-url: http://localhost:3000
  admin:
    enabled: false
    email: ""
    password: ""
  storage:
    endpoint: http://localhost:9000
    access-key: test-access
    secret-key: test-secret
    bucket: test-contents
    url-expiry-seconds: 300
  upload:
    image-max-bytes: 10485760
    pdf-max-bytes: 52428800
    video-max-bytes: 524288000
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
