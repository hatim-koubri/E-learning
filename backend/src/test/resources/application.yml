spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
app:
  jwt:
    secret: test-secret-key-with-at-least-thirty-two-characters
    expiration-minutes: 15
  password-reset:
    expiration-minutes: 30
  mail:
    from: test@elearning.local
  cors:
    allowed-origin: http://localhost:3000
  admin:
    enabled: false
    email: ""
    password: ""
  storage:
    endpoint: http://localhost:9000
    access-key: test-access
    secret-key: test-secret
    bucket: test-contents
  upload:
    image-max-bytes: 10485760
    pdf-max-bytes: 52428800
    video-max-bytes: 524288000
